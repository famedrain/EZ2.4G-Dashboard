name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m py_compile my_devices.py dashboard_state.py vendor_battery.py
      - name: Install build tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name EZ2.4G-Dashboard --icon app.ico my_devices.py
      - uses: actions/upload-artifact@v4
        with:
          name: EZ2.4G-Dashboard-windows-x64
          path: dist/EZ2.4G-Dashboard.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EZ2.4G-Dashboard-windows-x64
          path: dist
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/EZ2.4G-Dashboard.exe --clobber
